<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differential KV | Live Runtime Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 25, 0.7);
            --accent-color: #00f2ff;
            --secondary-color: #7000ff;
            --text-color: #e0e0e0;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1a0a33 0%, #050505 50%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 127, 0.3);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff7f;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff7f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            font-weight: 400;
            color: #888;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .chart-container {
            height: 200px;
            width: 100%;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 0.8rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>DiffKV Runtime</h1>
            <p style="color: #666; margin: 5px 0 0 0;">Production Observability Layer</p>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            SYSTEM ONLINE
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Token Generation Rate</h3>
            <div class="metric-value" id="tps-val">0.0</div>
            <div style="color: var(--accent-color);">TPS (Measured)</div>
            <div class="chart-container">
                <canvas id="tpsChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>VRAM Occupancy</h3>
            <div class="metric-value" id="vram-val">0.0</div>
            <div style="color: var(--secondary-color);">GB (Active)</div>
            <div class="chart-container">
                <canvas id="vramChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>Retrieval Hit-Rate</h3>
            <div class="metric-value" id="hit-rate-val">0%</div>
            <div style="color: #00ff7f;">Sparse Efficiency</div>
            <div class="chart-container">
                <canvas id="hitRateChart"></canvas>
            </div>
        </div>

        <div class="card full-width">
            <h3>Paging Activity & System Load</h3>
            <div class="chart-container" style="height: 300px;">
                <canvas id="systemChart"></canvas>
            </div>
        </div>
    </div>

    <div class="footer">
        DIFFERENTIAL KV PHASE 17.4 | HARDWARE-GROUNDED TELEMETRY
    </div>

    <script>
        const ctxTps = document.getElementById('tpsChart').getContext('2d');
        const ctxVram = document.getElementById('vramChart').getContext('2d');
        const ctxHitRate = document.getElementById('hitRateChart').getContext('2d');
        const ctxSystem = document.getElementById('systemChart').getContext('2d');

        const chartConfig = (label, color) => ({
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: label,
                    data: [],
                    borderColor: color,
                    backgroundColor: color + '20',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#555' }
                    }
                }
            }
        });

        const tpsChart = new Chart(ctxTps, chartConfig('TPS', '#00f2ff'));
        const vramChart = new Chart(ctxVram, chartConfig('VRAM', '#7000ff'));
        const hitRateChart = new Chart(ctxHitRate, chartConfig('Hit-Rate', '#00ff7f'));
        
        const systemChart = new Chart(ctxSystem, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Paging', data: [], borderColor: '#ff0055', tension: 0.4, borderWidth: 2, pointRadius: 0 },
                    { label: 'CPU', data: [], borderColor: '#ffaa00', tension: 0.4, borderWidth: 2, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { display: false },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

        async function updateMetrics() {
            try {
                const response = await fetch('/metrics');
                const data = await response.json();

                document.getElementById('tps-val').innerText = data.tps.toFixed(1);
                document.getElementById('vram-val').innerText = data.vram_gb.toFixed(2);
                document.getElementById('hit-rate-val').innerText = (data.hit_rate * 100).toFixed(1) + '%';

                const time = new Date().toLocaleTimeString();
                
                [tpsChart, vramChart, hitRateChart].forEach(chart => {
                    if (chart.data.labels.length > 20) {
                        chart.data.labels.shift();
                        chart.data.datasets[0].data.shift();
                    }
                    chart.data.labels.push(time);
                });

                tpsChart.data.datasets[0].data.push(data.tps);
                vramChart.data.datasets[0].data.push(data.vram_gb);
                hitRateChart.data.datasets[0].data.push(data.hit_rate);

                if (systemChart.data.labels.length > 20) {
                    systemChart.data.labels.shift();
                    systemChart.data.datasets[0].data.shift();
                    systemChart.data.datasets[1].data.shift();
                }
                systemChart.data.labels.push(time);
                systemChart.data.datasets[0].data.push(data.paging_activity * 100);
                systemChart.data.datasets[1].data.push(data.cpu_percent);

                tpsChart.update();
                vramChart.update();
                hitRateChart.update();
                systemChart.update();

            } catch (e) {
                console.error("Failed to fetch metrics", e);
            }
        }

        setInterval(updateMetrics, 1000);
    </script>
</body>
</html>
