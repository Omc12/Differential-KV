<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differential KV - Sparse Runtime</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --user-msg: #334155;
            --bot-msg: #1e293b;
            --border: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-dark);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .settings-btn:hover {
            background: var(--user-msg);
        }

        .messages-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out forwards;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-area {
            padding: 20px 30px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            background-color: var(--bg-card);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            padding: 10px;
            min-height: 24px;
            max-height: 150px;
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn, .stop-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover { background-color: var(--accent-hover); }
        
        .stop-btn {
            background-color: #ef4444;
            display: none;
        }
        .stop-btn:hover { background-color: #dc2626; }

        .metrics {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--text-main);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1><div class="status-dot"></div> Differential KV Sparse Runtime</h1>
            <button class="settings-btn" id="clearBtn">Clear Session</button>
        </div>

        <div class="messages-area" id="messagesArea">
            <!-- Messages go here -->
            <div class="message bot-message">
                Welcome to the Differential KV Sparse Runtime. I am currently running with a hybrid dense-recency window and live SVD compression. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Type a message... (Shift+Enter for newline)" rows="1"></textarea>
                <button class="send-btn" id="sendBtn">Send</button>
                <button class="stop-btn" id="stopBtn">Stop</button>
            </div>
        </div>
    </div>

    <script>
        const messagesArea = document.getElementById('messagesArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        let messageHistory = [];
        let currentController = null;

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', stopGeneration);
        clearBtn.addEventListener('click', clearSession);

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            div.innerText = text;
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';
            
            // Add user message to UI and history
            addMessage(text, true);
            messageHistory.push({ role: "user", content: text });

            // Prepare bot message bubble
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            messagesArea.appendChild(botDiv);
            
            // UI State
            sendBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            
            currentController = new AbortController();

            try {
                let fullResponse = "";
                let t0 = performance.now();
                let ttft = 0;
                let tokens = 0;

                const response = await fetch('http://localhost:8080/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "DifferentialKV",
                        messages: messageHistory,
                        stream: true,
                        max_tokens: 1024
                    }),
                    signal: currentController.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                                    if (tokens === 0) ttft = performance.now() - t0;
                                    
                                    fullResponse += data.choices[0].delta.content;
                                    tokens++;
                                    
                                    // Update UI
                                    botDiv.innerHTML = fullResponse.replace(/\\n/g, '<br>') + '<span class="cursor"></span>';
                                    messagesArea.scrollTop = messagesArea.scrollHeight;
                                }
                            } catch (e) {
                                console.error("Parse error", e, line);
                            }
                        }
                    }
                }
                
                // Finalize UI
                botDiv.innerHTML = fullResponse.replace(/\\n/g, '<br>');
                messageHistory.push({ role: "assistant", content: fullResponse });
                
                // Add metrics
                const totalTime = (performance.now() - t0) / 1000;
                const tps = tokens / (totalTime - (ttft/1000));
                
                const metricsDiv = document.createElement('div');
                metricsDiv.className = 'metrics';
                metricsDiv.innerHTML = `<span>TTFT: ${(ttft/1000).toFixed(2)}s</span><span>Speed: ${tps.toFixed(1)} t/s</span>`;
                botDiv.appendChild(metricsDiv);

            } catch (err) {
                if (err.name === 'AbortError') {
                    botDiv.innerHTML += "<br><i>[Generation Cancelled]</i>";
                } else {
                    botDiv.innerHTML += "<br><i style='color: #ef4444;'>[Connection Error]</i>";
                }
            } finally {
                sendBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                currentController = null;
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }
        }

        function stopGeneration() {
            if (currentController) {
                currentController.abort();
            }
        }

        function clearSession() {
            messageHistory = [];
            messagesArea.innerHTML = `
                <div class="message bot-message">
                    Session cleared. Memory buffers released.
                </div>
            `;
            // Call API to clear session on backend if needed, but not strictly required 
            // since a new prompt will just overwrite or we can pass a special flag.
            // For now, local history reset is enough to start fresh.
        }
    </script>
</body>
</html>
