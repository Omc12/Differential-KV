[build-system]
requires = ["setuptools>=64.0", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "dkv"
version = "1.2.0"
description = "Differential KV-Cache Management & High-Efficiency Attention Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Om Chimurkar"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.14.1",
    "numpy",
]

[project.optional-dependencies]
mlx = ["mlx"]
cuda = ["triton"]
dev = ["pytest", "build", "wheel"]

[tool.setuptools]
packages = [
    "dkv",
    "native_core",
    "native_core.compression",
    "native_core.graph_runtime",
    "native_core.paging",
    "native_core.sparse_decode",
    "native_core.srl",
    "runtime",
    "serving",
]

[tool.setuptools.package-dir]
"dkv" = "dkv"
"native_core" = "ACTIVE_RUNTIME/native_core"
"runtime" = "ACTIVE_RUNTIME/runtime"
"serving" = "ACTIVE_RUNTIME/serving"
